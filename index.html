<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jogo de Adivinhação</h1>
        <p>Vamos jogar! Pense em um número entre 1 e 100. Você terá apenas 10 tentativas para acertar!</p>
    </header>
    <main>
        
        <div>
            <label for="inputPalpite">Palpite</label>
            <input type="number" id="inputPalpite" placeholder="Digite um número entre 1 e 100">
        </div>  

        <button onclick="chutar()">Chutar</button>
        
        <p id="mensagemResultado"></p>
        <p id="numeroTentativa">Número de tentativas:</p>
    </main>
    <footer> 
        <p>&copy; 2026 Jogo Adivinhação. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
